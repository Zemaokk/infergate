name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.2
          uv sync --locked --no-editable
      - name: Check and test
        run: |
          git diff --check
          uv run --no-sync python -m compileall -q src scripts
          uv run --no-sync python -m pytest -q
          sha256sum --check docs/M4/evidence/SHA256SUMS

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.2
          uv sync --locked --no-editable
      - name: Verify isolated Docker stack
        run: uv run --no-sync python scripts/verify_m4.py --output "$RUNNER_TEMP/packaging.json"
      - name: Print packaging evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/packaging.json"; then
            cat "$RUNNER_TEMP/packaging.json"
          fi
