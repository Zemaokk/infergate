name: infergate-observability
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
  loki:
    image: grafana/loki:3.7.6
    ports:
      - "127.0.0.1:3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
  alloy:
    image: grafana/alloy:v1.21.2
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
      # 只有 Alloy 能访问 Docker socket，Agent 只通过 Loki 的只读查询接口拿日志。
      # 注意：给 docker.sock 加 :ro 并不能让 Docker API 变成只读，所以这里不加，避免产生错误的安全感。
      - /var/run/docker.sock:/var/run/docker.sock
      # 读取位置（positions 文件）存在这里；不持久化的话，Alloy 容器一重建就会把所有容器的历史日志重发一遍
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: infergate-local
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
  container-exporter:
    build:
      context: ..
      dockerfile: observability/container-exporter/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
