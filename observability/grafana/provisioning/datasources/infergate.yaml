apiVersion: 1
datasources:
  - name: InferGate Prometheus
    uid: infergate-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: InferGate Jaeger
    uid: infergate-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
  - name: InferGate Loki
    uid: infergate-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
