[project]
name = "infergate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zemao Chen", email = "zenochthu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
infergate = "infergate:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.infergate.mock_backend:app"
